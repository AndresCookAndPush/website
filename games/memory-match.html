    <meta name="supported-color-schemes" content="light">
    <title>Juego de Memoria - TiBO</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="memory-match.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../images/tibo-logo.png" type="image/png">
    <link rel="shortcut icon" href="../images/tibo-logo.png" type="image/png">

<body class="morning">
    <div id="sky-objects"></div>

    <header>
        <nav>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>

                    <img src="../images/tibo-logo.png" alt="TiBO Logo">

                </div>
            </div>
            <ul class="menu">
                <li><a href="../index.html">inicio</a></li>
                <li><a href="../index.html#cuentos">cuentos</a></li>
                <li><a href="../index.html#minijuegos">minijuegos</a></li>
                <li><a href="../english.html">english</a></li>

        </section>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="../images/tibo-logo.png" alt="TiBO Logo">

        document.addEventListener("DOMContentLoaded", () => {
            // Inicializar el juego de memoria
            MemoryGame.init('memory-game', 'medium');

            initializeSkyObjects();
            initializeMenuToggle();
