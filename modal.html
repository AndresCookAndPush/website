<!-- Modal para el video y opciones de descarga -->
<div id="storyModal" class="modal">
  <div class="modal-content">
    <div class="close-modal">
      <i class="fas fa-times"></i>
    </div>
    <div class="video-container">
      <iframe id="youtubeVideo" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div id="modalDownloadSection" class="modal-download-section">
      <a href="#" class="modal-download-button pulse-animation store-redirect">Prueba gratuita</a>
      <div class="modal-store-links">
        <a href="#" class="modal-store-link store-redirect" data-store="ios">
          <img src="images/app-store.svg" alt="App Store">
        </a>
        <a href="#" class="modal-store-link store-redirect" data-store="android">
          <img src="images/play-store.svg" alt="Google Play">
        </a>
      </div>
    </div>
  </div>
</div>
